<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffdf8"><title>Herculaneum live site map</title><link rel="stylesheet" href="../vendor/leaflet/leaflet.css"><style>
:root{--panel:#fffdf8;--text:#1c2521;--muted:#68716d;--accent:#225c4a;--line:#d6d0c3;--soft:#edf3ee;--hard:#a74338}*{box-sizing:border-box}html,body{height:100%;margin:0;color:var(--text);background:var(--panel);font:15px/1.4 system-ui,sans-serif}body{display:grid;grid-template-rows:auto minmax(280px,1fr) auto}header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:1rem}button{min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:800}button.secondary{background:var(--panel);color:var(--accent)}#map{min-height:0;background:#e8e2d5}.panel{padding:9px 10px calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}#status{font-weight:800}.muted{color:var(--muted);font-size:.82rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.site-marker,.user-marker{display:grid;place-items:center;border-radius:50%;border:2px solid white;box-shadow:0 1px 5px #0007;font-weight:900}.site-marker{width:28px;height:28px;background:var(--accent);color:#fff}.site-marker.next{background:#d57938;transform:scale(1.18)}.user-marker{width:22px;height:22px;background:#2176d2;border-width:4px}.leaflet-popup-content{margin:10px 12px;line-height:1.35}.leaflet-popup-content b{font-size:.92rem}.leaflet-control-attribution{font-size:9px}.notice{margin-top:5px}@media(min-width:760px){body{grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto 1fr}header{grid-column:1/3}.panel{grid-column:2;grid-row:2;border-top:0;border-left:1px solid var(--line);padding:16px}#map{grid-column:1;grid-row:2}}
</style></head><body>
<header><div><h1>Herculaneum live map</h1><div class="muted">Ordered core · signs override the line</div></div><button id="locate">Show my position</button></header>
<div id="map" aria-label="Herculaneum core route and live position"></div>
<section class="panel"><div id="status">Location is off.</div><div id="detail" class="muted notice">Tap “Show my position” inside the park. No location is stored or sent.</div><div class="actions"><button class="secondary" id="next">Next stop</button><button class="secondary" id="all">Show whole route</button></div><p class="muted">The line is orientation only. Follow park signs and barriers for open paths. Phone GPS can drift among walls; use the accuracy circle.</p></section>
<script src="../vendor/leaflet/leaflet.js"></script><script>
(()=>{'use strict';
const stops=[
 {n:1,name:'Entry / overlook',lat:40.80464,lng:14.34739,note:'Begin with the overview, then follow signs down through the Martusciello Gallery.'},
 {n:2,name:'Ancient Beach and boat shelters',lat:40.80545,lng:14.34622,note:'The ancient shoreline and residents’ final refuge.'},
 {n:3,name:'House of Relief of Telephus',lat:40.80527,lng:14.34731,note:'Large sea-facing elite house beside the south-east approach.'},
 {n:4,name:'House of the Deer',lat:40.80554,lng:14.34699,note:'Sea-facing residence; look for the deer sculpture group.'},
 {n:5,name:'House of Neptune and Amphitrite',lat:40.80613,lng:14.34791,note:'Find the blue-and-gold wall mosaic in the summer dining room.'},
 {n:6,name:'College of the Augustales',lat:40.80673,lng:14.34782,note:'Imperial-cult meeting place with mythological frescoes.'},
 {n:7,name:'House of the Wooden Partition',lat:40.80610,lng:14.34710,note:'Look for the carbonised folding screen between atrium and tablinum.'},
 {n:8,name:'Central Baths',lat:40.80639,lng:14.34746,note:'Finish the core here, then follow the signed exit route.'}
];
const map=L.map('map',{zoomControl:true}).setView([40.80575,14.34718],18);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap'}).addTo(map);
const route=L.polyline(stops.map(s=>[s.lat,s.lng]),{color:'#225c4a',weight:5,opacity:.82,dashArray:'9 7'}).addTo(map);const markers=stops.map(s=>L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:`<div class="site-marker" data-stop="${s.n}">${s.n}</div>`,iconSize:[28,28],iconAnchor:[14,14]})}).bindPopup(`<b>${s.n}. ${s.name}</b><br>${s.note}`).addTo(map));map.fitBounds(route.getBounds(),{padding:[28,28]});
let watch=null,user=null,accuracy=null,last=null,nextIndex=0;const status=document.getElementById('status'),detail=document.getElementById('detail'),locate=document.getElementById('locate');
const metres=(a,b)=>{const r=6371000,p=Math.PI/180,dLat=(b.lat-a.lat)*p,dLng=(b.lng-a.lng)*p,x=Math.sin(dLat/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dLng/2)**2;return 2*r*Math.asin(Math.sqrt(x));};
function highlight(index){nextIndex=Math.max(0,Math.min(stops.length-1,index));document.querySelectorAll('.site-marker').forEach((el,i)=>el.classList.toggle('next',i===nextIndex));const s=stops[nextIndex],distance=last?Math.round(metres(last,s)):null;status.textContent=`Next: ${s.n}. ${s.name}${distance!=null?` · about ${distance} m`:''}`;detail.textContent=s.note;}
function update(pos){const p={lat:pos.coords.latitude,lng:pos.coords.longitude},acc=Math.round(pos.coords.accuracy);last=p;if(!user)user=L.marker(p,{icon:L.divIcon({className:'',html:'<div class="user-marker"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map);else user.setLatLng(p);if(!accuracy)accuracy=L.circle(p,{radius:acc,color:'#2176d2',weight:1,fillOpacity:.12}).addTo(map);else accuracy.setLatLng(p).setRadius(acc);const nearest=stops.map((s,i)=>({i,d:metres(p,s)})).sort((a,b)=>a.d-b.d)[0];let candidate=nearest.i;if(nearest.d<28&&candidate<stops.length-1)candidate++;highlight(candidate);status.textContent+=` · accuracy ±${acc} m`;map.panTo(p);}
function error(err){status.textContent=err.code===1?'Location permission was denied.':'Current position is unavailable.';detail.textContent='Use the numbered route and official signs. You can try again.';locate.textContent='Try location again';if(watch!=null){navigator.geolocation.clearWatch(watch);watch=null;}}
locate.onclick=()=>{if(!navigator.geolocation){status.textContent='This browser does not provide location.';return;}if(watch!=null){navigator.geolocation.clearWatch(watch);watch=null;locate.textContent='Show my position';status.textContent='Location is off.';return;}locate.textContent='Stop location';status.textContent='Finding your position…';watch=navigator.geolocation.watchPosition(update,error,{enableHighAccuracy:true,maximumAge:3000,timeout:12000});};
document.getElementById('next').onclick=()=>{highlight(nextIndex+1);markers[nextIndex].openPopup();map.panTo(markers[nextIndex].getLatLng());};document.getElementById('all').onclick=()=>map.fitBounds(route.getBounds(),{padding:[28,28]});highlight(0);
})();
</script></body></html>
